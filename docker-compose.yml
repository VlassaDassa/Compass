name: compass
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-compass}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run setup:vps first}
      POSTGRES_DB: ${POSTGRES_DB:-compass}
    ports:
      - "127.0.0.1:${COMPASS_POSTGRES_PORT:-55432}:5432"
    volumes:
      - compass-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  compass-postgres-data:
